services:
  - type: web
    name: shelflife-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && sed -i 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma && npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts && npm run build
    startCommand: node dist/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shelflife-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://shelflife-shop.vercel.app
      - key: PORT
        value: 3001

databases:
  - name: shelflife-db
    plan: free
    databaseName: shelflife
    user: shelflife
