name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/srv-daab78m7bikc73fueisg/deploys")
          echo "Render deploy triggered: HTTP $STATUS"
          if [ "$STATUS" != "201" ]; then exit 1; fi

  # Frontend deploys automatically via Vercel's native GitHub integration.
  # Connect at: vercel.com → Project Settings → Git → Connect Repository
